name: zizmor

# Static analysis of the workflows themselves: unpinned actions, template
# injection, over-broad tokens, and the Dependabot cooldown. Fails on medium
# or higher; removing the cooldown is a medium finding.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor (workflows)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pipx is preinstalled on GitHub's Ubuntu images. The version is pinned so
      # a new zizmor release cannot change what this gate means overnight.
      - name: Run zizmor
        run: pipx run zizmor==1.31.1 --offline --min-severity medium .
