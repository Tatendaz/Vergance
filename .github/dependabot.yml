# Monthly, batched, and 7 days behind each release. Security updates ignore
# the cooldown, so a fix still lands the day GitHub flags the advisory.
version: 2
updates:
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      swift-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
